name: Nightly hardening
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  ios-export:
    uses: ./.github/workflows/ios.yml

  level-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements.txt
      - run: ./tools/Test-M2.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-data-hardening
          path: |
            artifacts/core/
            artifacts/m2/
  simulation-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Simulation fuzz with a recorded daily seed
        run: ./tools/Test-SimulationFuzz.ps1 -Seed ([UInt64]([DateTime]::UtcNow.ToString('yyyyMMdd'))) -EvidenceDirectory artifacts/nightly/simulation-fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-simulation-fuzz
          path: artifacts/nightly/simulation-fuzz/
  rendered-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libxrandr2 libxi6 libxcursor1 libxinerama1 libasound2t64
      - name: Install pinned engine and Python dependencies
        shell: pwsh
        run: |
          ./tools/Install-Godot.ps1
          python -m pip install -r tools/requirements.txt
      - name: Comparator and baseline failure contracts
        run: |
          python -m unittest discover -s tools -p test_compare_images.py
          python -m unittest discover -s tools -p test_visual_baseline.py
      - name: Rendered integration, repeat captures and reviewed baseline comparison
        run: xvfb-run -a -s '-screen 0 1920x1080x24' pwsh -NoProfile -File tools/Test-NightlyRendered.ps1 -Profile linux-gl-llvmpipe -EvidenceDirectory artifacts/nightly/rendered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-rendered-regression
          path: artifacts/nightly/rendered/
  benchmark-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Core budgets, six BenchmarkDotNet workloads and per-runner regression
        run: ./tools/Test-NightlyBenchmarks.ps1 -Runner linux-ubuntu24-x64 -EvidenceDirectory artifacts/nightly/benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-benchmark-regression
          path: |
            artifacts/nightly/benchmarks/
            artifacts/core/
# iOS export and physical soak jobs remain pending. An unmeasured Linux benchmark
# profile fails rather than using the Windows CPU baseline or bootstrapping success.
# This rendered job fails until a complete baseline from this profile is reviewed;
# desktop NVIDIA captures cannot substitute for the Linux llvmpipe review.
